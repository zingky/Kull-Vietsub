<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="lib/jassub.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        canvas { display: block; width: 100%; height: 100%; }
        #debug-text { position: absolute; color: white; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: Arial; opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <div id="debug-text">Loading JASSUB...</div>
    <canvas id="jassub-canvas"></canvas>
    
    <script>
        let jassubInstance = null;
        
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'init') {
                if (jassubInstance) jassubInstance.destroy();
                
                document.getElementById('debug-text').style.display = 'none';

                // KHỞI TẠO JASSUB VỚI FONT CHỮ CỦA EXTENSION
                jassubInstance = new JASSUB({
                    canvas: document.getElementById('jassub-canvas'),
                    subContent: data.content,
                    workerUrl: data.workerUrl, 
                    wasmUrl: data.wasmUrl,     
                    fonts: [data.fontUrl], // YẾU TỐ QUAN TRỌNG ĐỂ HIỆN CHỮ
                    fallbackFont: 'Arial'
                });

            } else if (data.type === 'time' && jassubInstance) {
                jassubInstance.setCurrentTime(data.currentTime);
            } else if (data.type === 'destroy' && jassubInstance) {
                jassubInstance.destroy();
                jassubInstance = null;
            }
        });
        
        // Báo hiệu Iframe đã load xong
        window.parent.postMessage({ type: 'iframe_ready' }, '*');
    </script>
</body>
</html>
